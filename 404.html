<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | Page Not Found</title>

<style>

/* ------------------------
BASE STYLE
------------------------ */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: "Segoe UI", sans-serif;
}

body{
background:#f4f4f4;
color:#111;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
padding:20px;
}

/* ------------------------
CONTAINER
------------------------ */

.container{
max-width:900px;
width:100%;
text-align:center;
}

/* ------------------------
404 TITLE
------------------------ */

.error-title{
font-size:120px;
font-weight:900;
letter-spacing:4px;
}

.subtitle{
font-size:28px;
margin-top:-10px;
margin-bottom:15px;
font-weight:600;
}

.desc{
color:#555;
max-width:500px;
margin:0 auto 40px;
line-height:1.5;
}

/* ------------------------
CARD
------------------------ */

.card{
background:white;
border:3px solid black;
padding:40px;
box-shadow:8px 8px 0px black;
transition:0.25s ease;
}

.card:hover{
transform:translate(-3px,-3px);
box-shadow:12px 12px 0px black;
}

/* ------------------------
BUTTONS
------------------------ */

.buttons{
margin-top:30px;
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
}

button{
border:2px solid black;
background:white;
padding:12px 26px;
font-size:16px;
font-weight:600;
cursor:pointer;
box-shadow:4px 4px 0px black;
transition:0.2s;
}

button:hover{
transform:translate(-2px,-2px);
box-shadow:6px 6px 0px black;
}

.primary{
background:#f5c400;
}

/* ------------------------
FOOTER TEXT
------------------------ */

.home-link{
display:block;
margin-top:25px;
font-size:14px;
color:#555;
}

.home-link a{
color:black;
font-weight:600;
text-decoration:none;
}

.home-link a:hover{
text-decoration:underline;
}

/* ------------------------
RESPONSIVE
------------------------ */

@media(max-width:600px){

.error-title{
font-size:80px;
}

.subtitle{
font-size:22px;
}

.card{
padding:30px 20px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1 class="error-title">404</h1>

<p class="subtitle">Page Not Found</p>

<p class="desc">
The page you are looking for might have been removed, renamed, or temporarily unavailable.
</p>

<div class="buttons">

<button class="primary" onclick="goHome()">Back to Home</button>

<button onclick="refreshPage()">Refresh Page</button>

</div>

<span class="home-link">
or return to the <a href="https://ebula.landecs.org">main site</a>
</span>

</div>

</div>

<script>

function goHome(){
window.location.href = "/";
}

function refreshPage(){
location.reload();
}

</script>

</body>
</html>
